[project]
name = "csdap-agent"
version = "0.1.0"
description = "Agent-based data search over NASA CSDAP using LangGraph + Pydantic AI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # Web / UI
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "chainlit>=1.3",
    "python-multipart>=0.0.9",
    # Agent stack
    "langgraph>=0.2.50",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "pydantic-ai>=0.0.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # Observability
    "logfire>=1.0",
    # Data stores
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "neo4j>=5.24",
    # CSDA / STAC
    "csda-client @ git+https://github.com/nasa-impact/csda-client",
    "pystac-client>=0.8",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/csdap_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
